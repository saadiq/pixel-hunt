<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 60" width="52" height="60">
  <metadata>{"id":"snowman","name":"Snowman","blurb":"Built this morning, watching the house all evening.","band":"hard","W":52,"H":60,"slots":2,"lanes":5,"chunk":[21,31],"wait":0.9,"waitSlack":1,"bg":"#2c3e7a"}</metadata>
  <defs>
    <pattern id="flakes" width="8" height="7" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="1" height="1" fill="#ffffff"/>
      <rect x="5" y="4" width="1" height="1" fill="#ffffff"/>
    </pattern>
    <clipPath id="pane"><rect x="3" y="3" width="46" height="54"/></clipPath>
  </defs>
  <rect width="52" height="60" fill="#7a4a2b"/>
  <g clip-path="url(#pane)"><g transform="translate(3 3)">
  <!-- snowy evening sky -->
  <rect width="46" height="54" fill="#2c3e7a"/>
  <rect width="46" height="42" fill="url(#flakes)"/>
  <!-- moon -->
  <circle cx="33" cy="6" r="3.5" fill="#ffe27a"/>
  <circle cx="34.5" cy="5" r="3" fill="#2c3e7a"/>
  <!-- pine trees behind -->
  <g fill="#2f8f5b" stroke="#1d1b2b" stroke-width="1">
    <path d="M5.5,40.5 L0.5,40.5 L5.5,22.5 L10.5,40.5 Z"/>
    <path d="M40.5,40.5 L34.5,40.5 L40.5,18.5 L45.5,40.5 Z"/>
  </g>
  <g fill="#ffffff"><rect x="4" y="26" width="3" height="1"/><rect x="3" y="32" width="5" height="1"/><rect x="39" y="23" width="3" height="1"/><rect x="38" y="30" width="5" height="1"/></g>
  <!-- snowy ground -->
  <path d="M0,42 C10,39 34,39 46,42 L46,54 L0,54 Z" fill="#ffffff"/>
  <path d="M0,42 C10,39 34,39 46,42" stroke="#1d1b2b" stroke-width="1" fill="none"/>
  <g fill="#9ec6e6"><rect x="3" y="47" width="6" height="1"/><rect x="34" y="49" width="7" height="1"/><rect x="14" y="51" width="5" height="1"/></g>

  <!-- stick arms -->
  <g stroke="#7a4a2b" stroke-width="1.2" stroke-linecap="round" fill="none">
    <path d="M14,29 L5,21 M8,24 L6,19"/>
    <path d="M32,29 L41,22 M38,24 L40,19"/>
  </g>

  <!-- three snowballs, bottom up, with blue shading -->
  <g stroke="#1d1b2b" stroke-width="1">
    <circle cx="23" cy="40" r="10.5" fill="#ffffff"/>
    <circle cx="23" cy="25.5" r="8" fill="#ffffff"/>
    <circle cx="23" cy="13" r="6.5" fill="#ffffff"/>
  </g>
  <path d="M29,32 C34,36 34,46 26,50 C29,44 29,38 29,32 Z" fill="#9ec6e6"/>
  <path d="M27,19 C32,22 32,29 25,33 C28,29 28,24 27,19 Z" fill="#9ec6e6"/>
  <path d="M26.5,9 C29,11 29,16 26,18 C27.5,15 27.5,12 26.5,9 Z" fill="#9ec6e6"/>

  <!-- top hat -->
  <rect x="15.5" y="7.5" width="15" height="2" fill="#1d1b2b"/>
  <rect x="18.5" y="0.5" width="9" height="7.5" fill="#1d1b2b"/>
  <rect x="19" y="5" width="8" height="1.5" fill="#e23b3b"/>
  <!-- face: coal eyes, carrot nose, smile -->
  <g fill="#1d1b2b"><rect x="20" y="11" width="2" height="2"/><rect x="25" y="11" width="2" height="2"/>
    <rect x="19" y="15" width="1" height="1"/><rect x="20" y="16" width="1" height="1"/><rect x="22" y="17" width="2" height="1"/><rect x="25" y="16" width="1" height="1"/><rect x="26" y="15" width="1" height="1"/></g>
  <path d="M23,13 L29.5,14.5 L23,15.5 Z" fill="#f08a24"/>

  <!-- striped scarf -->
  <path d="M15.5,18.5 C19,20.5 27,20.5 30.5,18.5 L31.5,22.5 C27,24.5 19,24.5 14.5,22.5 Z" fill="#e23b3b" stroke="#1d1b2b" stroke-width="1"/>
  <rect x="16.5" y="22.5" width="4" height="9" fill="#e23b3b" stroke="#1d1b2b" stroke-width="1"/>
  <g fill="#ffe27a"><rect x="19" y="21" width="2" height="2"/><rect x="24" y="21" width="2" height="2"/><rect x="17" y="25" width="3" height="1"/><rect x="17" y="28" width="3" height="1"/></g>

  <!-- coal buttons -->
  <g fill="#1d1b2b"><rect x="22" y="26" width="2" height="2"/><rect x="22" y="29.5" width="2" height="2"/><rect x="22" y="35" width="2" height="2"/><rect x="22" y="40" width="2" height="2"/></g>
  </g></g>
  <!-- the cottage window frame -->
  <rect x="2.5" y="2.5" width="47" height="55" fill="none" stroke="#1d1b2b" stroke-width="1"/>
  <rect x="0.5" y="0.5" width="51" height="59" fill="none" stroke="#1d1b2b" stroke-width="1"/>
  <!-- curtains tied back at the corners -->
  <path d="M3,3 L14,3 C11,9 8,14 4,17 L3,17 Z" fill="#e23b3b" stroke="#1d1b2b" stroke-width="1"/>
  <path d="M49,3 L38,3 C41,9 44,14 48,17 L49,17 Z" fill="#e23b3b" stroke="#1d1b2b" stroke-width="1"/>
  <g fill="#ffe27a"><rect x="3" y="14" width="3" height="2"/><rect x="46" y="14" width="3" height="2"/></g>
