<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 50" width="48" height="50">
  <metadata>{"id":"ladybug","name":"Ladybug on a Leaf","blurb":"Six spots, six legs and a whole leaf to herself.","band":"hard","W":48,"H":50,"slots":3,"lanes":5,"chunk":[21,31],"wait":0.8,"waitSlack":1,"bg":"#fff0a6"}</metadata>
  <defs>
    <pattern id="dots" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="2" height="2" fill="#ff9fcf"/>
      <rect x="5" y="5" width="2" height="2" fill="#ff9fcf"/>
    </pattern>
    <path id="leaf" d="M5,46 C4,30 10,14 24,7 C31,3.5 38,3 44,3 C45,16 41,31 31,39 C23,45 14,47 5,46 Z"/>
    <clipPath id="leafClip"><use href="#leaf"/></clipPath>
    <clipPath id="shellClip"><ellipse cx="25" cy="28" rx="10" ry="11"/></clipPath>
    <g id="drop">
      <circle cx="0" cy="0" r="2.6" fill="#8fd6f2" stroke="#1d1d2b" stroke-width="0.9"/>
      <rect x="-1" y="-1" width="1" height="1" fill="#ffffff"/>
    </g>
  </defs>
  <!-- sunny backdrop -->
  <rect width="48" height="50" fill="#fff0a6"/>
  <rect width="48" height="50" fill="url(#dots)"/>

  <!-- the leaf with its stem -->
  <path d="M5,46 L1,49.5" stroke="#1d1d2b" stroke-width="3.2" stroke-linecap="round"/>
  <path d="M5,46 L1,49.5" stroke="#2c8a40" stroke-width="1.4" stroke-linecap="round"/>
  <use href="#leaf" fill="#6cc84a" stroke="#1d1d2b" stroke-width="2.2" stroke-linejoin="round"/>
  <g clip-path="url(#leafClip)">
    <path d="M28,40 C36,32 42,20 44,3 C34,12 32,30 28,40 Z" fill="#2c8a40"/>
  </g>
  <g stroke="#2c8a40" stroke-width="1.2" fill="none" stroke-linecap="round">
    <path d="M6,45 C14,34 26,20 43,4"/>
    <path d="M13,36 L10,26 M19,29 L17,17 M26,22 L26,11 M16,33 L26,35 M22,26 L33,28"/>
  </g>

  <!-- dew drops -->
  <use href="#drop" transform="translate(11 38)"/>
  <use href="#drop" transform="translate(38 13)"/>
  <use href="#drop" transform="translate(15 20)"/>

  <!-- ladybug: legs, head, shell -->
  <g stroke="#1d1d2b" stroke-width="1.2" stroke-linecap="round">
    <path d="M15,22 L11,19 M14.5,29 L10,29 M16,36 L12,39 M35,22 L39,19 M35.5,29 L40,29 M34,36 L38,39"/>
    <path d="M22,15 L19,11 M28,15 L31,11"/>
  </g>
  <ellipse cx="25" cy="17" rx="5" ry="3.8" fill="#1d1d2b"/>
  <ellipse cx="25" cy="28" rx="11" ry="12" fill="#1d1d2b"/>
  <g clip-path="url(#shellClip)">
    <rect x="14" y="16" width="22" height="24" fill="#e8342c"/>
    <!-- spots -->
    <g fill="#1d1d2b">
      <circle cx="20.5" cy="23.5" r="1.8"/><circle cx="29.5" cy="23.5" r="1.8"/>
      <circle cx="19.5" cy="31" r="1.8"/><circle cx="30.5" cy="31" r="1.8"/>
      <circle cx="22" cy="36" r="1.4"/><circle cx="28" cy="36" r="1.4"/>
    </g>
    <rect x="24.5" y="16" width="1" height="24" fill="#1d1d2b"/>
    <!-- shine -->
    <rect x="17" y="26" width="2" height="2" fill="#ffffff"/>
  </g>
  <!-- face, and pink tips on the antennae -->
  <g fill="#ffffff"><rect x="22" y="15" width="2" height="2"/><rect x="27" y="15" width="2" height="2"/></g>
  <g fill="#1d1d2b"><rect x="23" y="16" width="1" height="1"/><rect x="27" y="16" width="1" height="1"/></g>
  <g fill="#ff9fcf"><rect x="18" y="10" width="2" height="2"/><rect x="30" y="10" width="2" height="2"/></g>
</svg>
