<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 52" width="50" height="52">
  <metadata>{"id":"sea-turtle","name":"Sea Turtle","blurb":"Gliding home over the coral, in no hurry at all.","band":"hard","W":50,"H":52,"slots":3,"lanes":5,"chunk":[26,38],"wait":0.85,"waitSlack":1,"bg":"#2a6fc4"}</metadata>
  <defs>
    <pattern id="light" width="10" height="9" patternUnits="userSpaceOnUse">
      <rect x="1" y="2" width="3" height="1" fill="#8fe0f0"/>
      <rect x="6" y="6" width="2" height="1" fill="#8fe0f0"/>
    </pattern>
    <path id="flipper" d="M0,0 C5,-3 11,-3 16,1 C11,2 6,4.5 0,4.5 Z"/>
    <g id="skin">
      <use href="#flipper" transform="translate(8 -7) rotate(-10)"/>
      <use href="#flipper" transform="scale(-1 1) translate(8 -7) rotate(-10)"/>
      <use href="#flipper" transform="translate(6 9) rotate(40) scale(0.55)"/>
      <use href="#flipper" transform="scale(-1 1) translate(6 9) rotate(40) scale(0.55)"/>
      <ellipse cx="0" cy="-16.5" rx="3.8" ry="4.6"/>
      <path d="M0,12 L-1.8,17 L1.8,17 Z"/>
    </g>
  </defs>
  <!-- open water with sun ripples -->
  <rect width="50" height="52" fill="#2a6fc4"/>
  <rect width="50" height="42" fill="url(#light)"/>

  <!-- sandy floor with coral -->
  <path d="M0,44 C10,41 20,43 28,42 C38,41 44,43 50,42 L50,52 L0,52 Z" fill="#1c2a3a"/>
  <path d="M0,45 C10,42 20,44 28,43 C38,42 44,44 50,43 L50,52 L0,52 Z" fill="#f2d48a"/>
  <path d="M4,45 L4,37 L2,34 M4,39 L7,35 L7,32" fill="#ff6f7d"/>
  <g stroke="#ff6f7d" stroke-width="1.6" stroke-linecap="round" fill="none">
    <path d="M4,45 L4,37 L2,34 M4,39 L7,35 L7,32"/>
    <path d="M42,44 L42,35 M42,38 L46,34 L46,31 M42,36 L39,33"/>
  </g>
  <g fill="#1c2a3a"><rect x="12" y="48" width="3" height="1"/><rect x="31" y="49" width="4" height="1"/><rect x="22" y="50" width="2" height="1"/></g>

  <!-- the turtle, seen from above, swimming up -->
  <g transform="translate(25 23)">
    <!-- outline underlay -->
    <g fill="#1c2a3a" stroke="#1c2a3a" stroke-width="2.4" stroke-linejoin="round">
      <use href="#skin"/>
      <ellipse cx="0" cy="0" rx="11" ry="13"/>
    </g>
    <!-- skin -->
    <use href="#skin" fill="#8fd16a"/>
    <!-- spots on the front flippers -->
    <g fill="#2f7a4a">
      <rect x="15" y="-10" width="2" height="2"/><rect x="-17" y="-10" width="2" height="2"/>
      <rect x="19" y="-11" width="2" height="1"/><rect x="-21" y="-11" width="2" height="1"/>
    </g>
    <!-- shell: brown with amber scutes -->
    <ellipse cx="0" cy="0" rx="11" ry="13" fill="#8a5428"/>
    <g fill="#f0a63c">
      <path d="M0,-5 L4,-2.5 L4,2.5 L0,5 L-4,2.5 L-4,-2.5 Z"/>
      <path d="M0,-11.5 L3.5,-10 L3.5,-7 L0,-5 L-3.5,-7 L-3.5,-10 Z"/>
      <path d="M0,5 L3.5,7 L3.5,10 L0,11.5 L-3.5,10 L-3.5,7 Z"/>
      <path d="M5,-8 L8.5,-5 L8.5,0 L5,0 Z"/>
      <path d="M-5,-8 L-8.5,-5 L-8.5,0 L-5,0 Z"/>
      <path d="M5,2 L8.5,2 L7.5,6.5 L5,8.5 Z"/>
      <path d="M-5,2 L-8.5,2 L-7.5,6.5 L-5,8.5 Z"/>
    </g>
  </g>
  <!-- eyes on the grid -->
  <g fill="#1c2a3a"><rect x="22" y="5" width="1" height="2"/><rect x="27" y="5" width="1" height="2"/></g>

  <!-- a few bubbles rising -->
  <g fill="#8fe0f0" stroke="#1c2a3a" stroke-width="0.8">
    <circle cx="15" cy="3" r="1.4"/><circle cx="36" cy="4" r="1.4"/>
  </g>
