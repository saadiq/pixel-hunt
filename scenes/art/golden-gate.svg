<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 56" width="54" height="56">
  <metadata>{"id":"golden-gate","name":"Golden Gate in Fog","blurb":"The towers peek out of the fog, on a postage stamp.","band":"hard","W":54,"H":56,"slots":3,"lanes":5,"chunk":[20,30],"wait":0.9,"waitSlack":1,"bg":"#d9b48a"}</metadata>
  <defs>
    <clipPath id="pic"><rect x="6" y="6" width="42" height="44"/></clipPath>
    <pattern id="holesH" x="0.5" y="0" width="3" height="56" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#d9b48a"/><circle cx="1.5" cy="54.5" r="1.1" fill="#d9b48a"/>
    </pattern>
    <pattern id="holesV" x="0" y="1" width="54" height="3" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.1" fill="#d9b48a"/><circle cx="52.5" cy="1.5" r="1.1" fill="#d9b48a"/>
    </pattern>
    <!-- a fog puff: outline underlay, white body, grey belly -->
    <g id="puff">
      <circle cx="0" cy="0" r="4.6" fill="#22303f"/>
      <circle cx="0" cy="0" r="3.6" fill="#ffffff"/>
      <rect x="-2.5" y="1.5" width="5" height="1.6" fill="#9eabbd"/>
    </g>
  </defs>
  <!-- kraft envelope -->
  <rect width="54" height="56" fill="#d9b48a"/>
  <!-- the stamp: white paper with perforated edge -->
  <rect x="1" y="1" width="52" height="54" fill="#ffffff"/>
  <rect width="54" height="56" fill="url(#holesH)"/>
  <rect width="54" height="56" fill="url(#holesV)"/>
  <rect x="5" y="5" width="44" height="46" fill="#22303f"/>

  <g clip-path="url(#pic)">
    <rect width="54" height="56" fill="#8fd3ff"/>
    <circle cx="42" cy="11" r="3.6" fill="#ffd23f" stroke="#22303f" stroke-width="1"/>
    <!-- headland on the right -->
    <path d="M42,38 C44,31 47,29 51,30 L51,38 Z" fill="#5aa04a" stroke="#22303f" stroke-width="1"/>
    <path d="M4,36 C6,32 9,31 12,33 L12,38 L4,38 Z" fill="#5aa04a" stroke="#22303f" stroke-width="1"/>
    <path d="M23,38 C25,34.5 28,34 31,36 L31,39 L23,39 Z" fill="#5aa04a" stroke="#22303f" stroke-width="1"/>
    <!-- far tower -->
    <g stroke="#22303f" stroke-width="1">
      <rect x="37.5" y="18.5" width="7" height="22" fill="#e8553a"/>
      <rect x="39.5" y="20.5" width="3" height="4" fill="#8fd3ff"/>
      <rect x="39.5" y="26.5" width="3" height="4" fill="#8fd3ff"/>
      <rect x="39.5" y="32.5" width="3" height="5" fill="#8fd3ff"/>
    </g>
    <!-- main cables and suspenders -->
    <g stroke="#e8553a" fill="none">
      <path d="M23.5,8.5 C27,28 33,31 38,19 M12,8.5 C10.5,15 8.5,19 5,21" stroke-width="1.2"/>
      <path d="M26.5,19.5 V32 M29.5,25 V32 M32.5,26.5 V32 M35.5,25 V32 M9.5,17 V32" stroke-width="0.9"/>
    </g>
    <!-- near tower: a slim frame of legs and beams, sky showing through the portals -->
    <g stroke="#22303f" stroke-width="1">
      <rect x="12.5" y="7.5" width="11" height="44" fill="#e8553a"/>
      <rect x="15.5" y="11.5" width="5" height="6" fill="#8fd3ff"/>
      <rect x="15.5" y="19.5" width="5" height="6" fill="#8fd3ff"/>
      <rect x="15.5" y="27.5" width="5" height="6" fill="#8fd3ff"/>
      <rect x="15.5" y="35.5" width="5" height="8" fill="#8fd3ff"/>
      <rect x="13.5" y="5.5" width="9" height="2" fill="#e8553a"/>
    </g>
    <g fill="#ffd23f"><rect x="14" y="9" width="1" height="1"/><rect x="21" y="9" width="1" height="1"/><rect x="38" y="17" width="1" height="1"/><rect x="43" y="17" width="1" height="1"/><rect x="18" y="4" width="1" height="1"/></g>
    <g fill="#ffd23f"><rect x="26" y="18" width="1" height="1"/><rect x="29" y="24" width="1" height="1"/><rect x="32" y="26" width="1" height="1"/><rect x="35" y="24" width="1" height="1"/><rect x="9" y="16" width="1" height="1"/></g>
    <!-- gulls -->
    <g fill="#22303f">
      <rect x="28" y="10" width="1" height="1"/><rect x="29" y="11" width="1" height="1"/><rect x="30" y="10" width="1" height="1"/>
      <rect x="31" y="14" width="1" height="1"/><rect x="32" y="15" width="1" height="1"/><rect x="33" y="14" width="1" height="1"/>
    </g>
    <!-- the deck, with traffic -->
    <rect x="-1" y="31.5" width="56" height="3" fill="#e8553a" stroke="#22303f" stroke-width="1"/>
    <g fill="#ffd23f"><rect x="8" y="32" width="2" height="1"/><rect x="30" y="33" width="2" height="1"/></g>
    <g fill="#ffffff"><rect x="25" y="32" width="2" height="1"/><rect x="44" y="33" width="2" height="1"/></g>
    <g fill="#2a62c9"><rect x="11" y="33" width="2" height="1"/><rect x="36" y="32" width="2" height="1"/></g>
    <g fill="#5aa04a"><rect x="40" y="32" width="2" height="1"/></g>
    <!-- the fog bank -->
    <rect x="0" y="40" width="54" height="5" fill="#22303f"/>
    <use href="#puff" x="5" y="40.5"/><use href="#puff" x="12" y="39"/><use href="#puff" x="20" y="40.5"/>
    <use href="#puff" x="27" y="38.5"/><use href="#puff" x="34" y="40"/><use href="#puff" x="41" y="38"/><use href="#puff" x="48" y="40.5"/>
    <rect x="0" y="40.5" width="54" height="2.5" fill="#ffffff"/>
    <rect x="0" y="42.6" width="54" height="1.4" fill="#9eabbd"/>
    <!-- water -->
    <rect x="0" y="44" width="54" height="10" fill="#2a62c9"/>
    <g fill="#ffffff"><rect x="8" y="46" width="3" height="1"/><rect x="20" y="48" width="4" height="1"/><rect x="42" y="47" width="3" height="1"/></g>
    <path d="M32,48.5 V44.5 L36,48.5 Z" fill="#ffffff"/><rect x="32" y="44" width="1" height="5" fill="#22303f"/>
    <rect x="31" y="48.5" width="6" height="1.2" fill="#e8553a"/>
  </g>
</svg>
