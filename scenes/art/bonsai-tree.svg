<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50" width="50" height="50">
  <metadata>{"id":"bonsai-tree","name":"Bonsai Tree","blurb":"A hundred years of patience, in one small pot.","band":"hard","W":50,"H":50,"slots":3,"lanes":5,"chunk":[22,32],"wait":0.8,"waitSlack":1,"bg":"#f6e7c4"}</metadata>
  <defs>
    <pattern id="shoji" x="0" y="0" width="8" height="10" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="1" height="10" fill="#c99d63"/>
      <rect x="0" y="0" width="8" height="1" fill="#c99d63"/>
    </pattern>
    <!-- a cloud-shaped foliage pad centred on 0,0 -->
    <g id="pad">
      <ellipse cx="0" cy="0" rx="7" ry="3.6"/>
      <circle cx="-3.6" cy="-1.6" r="3"/>
      <circle cx="1" cy="-2.6" r="3.2"/>
      <circle cx="4.6" cy="-1" r="2.6"/>
    </g>
    <g id="pads">
      <use href="#pad" transform="translate(10 19)"/>
      <use href="#pad" transform="translate(39 14) scale(1.05)"/>
      <use href="#pad" transform="translate(24 8) scale(1.1)"/>
      <use href="#pad" transform="translate(29 23) scale(0.75)"/>
    </g>
    <g id="padTop">
      <circle cx="-3.4" cy="-2.2" r="2"/>
      <circle cx="1" cy="-3" r="2.2"/>
      <circle cx="4.2" cy="-1.6" r="1.6"/>
    </g>
    <g id="trunk">
      <path d="M24,33 C22,28 16,27 17,22 C18,18 25,19 26,14 C26.5,11 25,9 24,8"/>
      <path d="M18,23 C14,22 11,22 9,20"/>
      <path d="M25,17 C30,16 35,17 39,15"/>
    </g>
  </defs>
  <!-- shoji screen and the red sun behind -->
  <rect width="50" height="50" fill="#f6e7c4"/>
  <rect x="0" y="0" width="50" height="38" fill="url(#shoji)"/>
  <circle cx="9" cy="7" r="5.5" fill="#e8503a"/>

  <!-- low wooden table -->
  <rect x="0" y="38" width="50" height="12" fill="#2a1e1a"/>
  <rect x="0" y="39" width="50" height="3" fill="#8a5a3a"/>
  <rect x="3" y="42" width="3" height="8" fill="#8a5a3a"/>
  <rect x="44" y="42" width="3" height="8" fill="#8a5a3a"/>
  <g fill="#c99d63"><rect x="10" y="40" width="6" height="1"/><rect x="28" y="40" width="8" height="1"/></g>

  <!-- trunk: twisting up from the pot, with one branch to each side -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <use href="#trunk" stroke="#2a1e1a" stroke-width="5.4"/>
    <use href="#trunk" stroke="#8a5a3a" stroke-width="3"/>
  </g>

  <!-- foliage pads: outline, dark green, light tops -->
  <use href="#pads" fill="#2a1e1a" stroke="#2a1e1a" stroke-width="2.2" stroke-linejoin="round"/>
  <use href="#pads" fill="#2f7d3c"/>
  <g fill="#86cc4a">
    <use href="#padTop" transform="translate(10 19)"/>
    <use href="#padTop" transform="translate(39 14) scale(1.05)"/>
    <use href="#padTop" transform="translate(24 8) scale(1.1)"/>
    <use href="#padTop" transform="translate(29 23) scale(0.75)"/>
  </g>

  <!-- glazed pot, soil and moss -->
  <path d="M11,31 L39,31 L37,37.5 L13,37.5 Z" fill="#3a6fc4" stroke="#2a1e1a" stroke-width="1.4" stroke-linejoin="round"/>
  <rect x="10" y="30" width="30" height="2.4" fill="#2a1e1a"/>
  <rect x="12" y="29.5" width="26" height="1.5" fill="#2f7d3c"/>
  <g fill="#86cc4a"><rect x="15" y="29" width="3" height="1"/><rect x="30" y="29" width="4" height="1"/></g>
  <rect x="16" y="34" width="18" height="1" fill="#f6e7c4"/>
</svg>
