<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 54" width="48" height="54">
  <metadata>{"id":"hilltop-castle","name":"Castle on a Hill","blurb":"Up the winding path, the flags are flying for you.","band":"hard","W":48,"H":54,"slots":3,"lanes":5,"chunk":[22,32],"wait":0.8,"waitSlack":1,"bg":"#8fd0ff"}</metadata>
  <defs>
    <g id="cloud">
      <ellipse cx="0" cy="0" rx="5" ry="1.8"/>
      <circle cx="-1.6" cy="-1.2" r="2"/>
      <circle cx="1.6" cy="-1.6" r="2.4"/>
    </g>
    <!-- a round tower: wall, conical roof and a flag, base centred on 0,0 -->
    <g id="tower">
      <rect x="-4" y="-16" width="8" height="16" fill="#b9bdcc" stroke="#262a3a" stroke-width="1.2"/>
      <path d="M-5.4,-15.5 L0,-25 L5.4,-15.5 Z" fill="#d9413a" stroke="#262a3a" stroke-width="1.2" stroke-linejoin="round"/>
      <rect x="-0.5" y="-30" width="1" height="5" fill="#262a3a"/>
      <path d="M0.5,-30 L4.5,-28.6 L0.5,-27.2 Z" fill="#ffd23f"/>
      <rect x="-1" y="-11" width="2" height="3" fill="#262a3a"/>
    </g>
    <g id="wall">
      <rect x="-11" y="-10" width="22" height="10"/>
      <rect x="-6" y="-13" width="2" height="3"/><rect x="-1" y="-13" width="2" height="3"/><rect x="4" y="-13" width="2" height="3"/>
    </g>
  </defs>
  <!-- sky and clouds -->
  <rect width="48" height="54" fill="#8fd0ff"/>
  <g fill="#ffffff">
    <use href="#cloud" transform="translate(7 8)"/>
    <use href="#cloud" transform="translate(41 5) scale(0.8)"/>
    <use href="#cloud" transform="translate(42 22) scale(0.7)"/>
  </g>

  <!-- far hill behind, then the castle hill -->
  <path d="M-1,40 C8,34 16,35 22,38 L-1,46 Z" fill="#2e8a46" stroke="#262a3a" stroke-width="1.2"/>
  <path d="M-1,55 L-1,44 C6,38 12,33 24,32 C36,33 42,38 49,42 L49,55 Z" fill="#5cbf4a" stroke="#262a3a" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- winding path up to the gate -->
  <path d="M30,55 C30,51 18,50 18,46 C18,42 28,42 27,37 L24,34" fill="none" stroke="#262a3a" stroke-width="4.4" stroke-linecap="round"/>
  <path d="M30,55 C30,51 18,50 18,46 C18,42 28,42 27,37 L24,34" fill="none" stroke="#e9c27a" stroke-width="2.4" stroke-linecap="round"/>

  <!-- trees dotted on the slope -->
  <g fill="#2e8a46" stroke="#262a3a" stroke-width="1.1">
    <circle cx="8" cy="45" r="2.6"/><circle cx="40" cy="44" r="2.6"/><circle cx="42" cy="50" r="2.2"/><circle cx="7" cy="51" r="2.2"/>
  </g>

  <!-- the castle: curtain wall with battlements, keep, towers -->
  <g transform="translate(24 33)">
    <!-- keep -->
    <rect x="-5" y="-20" width="10" height="14" fill="#b9bdcc" stroke="#262a3a" stroke-width="1.2"/>
    <path d="M-6.4,-19.5 L0,-27 L6.4,-19.5 Z" fill="#d9413a" stroke="#262a3a" stroke-width="1.2" stroke-linejoin="round"/>
    <rect x="-0.5" y="-32" width="1" height="5" fill="#262a3a"/>
    <path d="M0.5,-32 L5,-30.5 L0.5,-29 Z" fill="#ffd23f"/>
    <rect x="-1" y="-18" width="2" height="3" fill="#ffd23f" stroke="#262a3a" stroke-width="0.8"/>
    <!-- wall -->
    <use href="#wall" fill="#262a3a" stroke="#262a3a" stroke-width="2.2"/>
    <use href="#wall" fill="#b9bdcc"/>
    <!-- gate -->
    <path d="M-3.4,0 L-3.4,-5 C-3.4,-9 3.4,-9 3.4,-5 L3.4,0 Z" fill="#262a3a"/>
    <path d="M-2,0 L-2,-5 C-2,-6.6 2,-6.6 2,-5 L2,0 Z" fill="#e9c27a"/>
    <rect x="-0.5" y="-6" width="1" height="6" fill="#262a3a"/>
    <!-- side towers -->
    <use href="#tower" transform="translate(-13 1)"/>
    <use href="#tower" transform="translate(13 1)"/>
