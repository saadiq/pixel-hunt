<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 54" width="54" height="54">
  <metadata>{"id":"rose-window","name":"Rose Window","blurb":"Sunlight pouring through a cathedral's stained glass.","band":"hard","W":54,"H":54,"slots":3,"lanes":5,"chunk":[70,100],"wait":0.8,"waitSlack":1,"bg":"#dcc9a6"}</metadata>
