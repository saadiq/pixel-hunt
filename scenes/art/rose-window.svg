    <use href="#jewel" transform="rotate(120 27 27)"/><use href="#jewel" transform="rotate(180 27 27)"/>
    <use href="#jewel" transform="rotate(240 27 27)"/><use href="#jewel" transform="rotate(300 27 27)"/>
