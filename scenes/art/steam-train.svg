<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 44" width="56" height="44">
  <metadata>{"id":"steam-train","name":"Steam Train","blurb":"Full steam ahead across the valley.","band":"hard","W":56,"H":44,"slots":3,"lanes":5,"chunk":[20,29],"wait":0.8,"waitSlack":1,"bg":"#8fd3ff"}</metadata>
