<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 54" width="50" height="54">
  <metadata>{"id":"teapot","name":"Tea Time","blurb":"A fresh pot, a full cup and nowhere to be.","band":"hard","W":50,"H":54,"slots":3,"lanes":5,"chunk":[22,32],"wait":0.9,"waitSlack":1,"bg":"#ffd8a8"}</metadata>
  <defs>
    <pattern id="wallpaper" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="2" height="2" fill="#ff9ec4"/>
      <rect x="5" y="5" width="2" height="2" fill="#ff9ec4"/>
    </pattern>
    <pattern id="gingham" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="4" fill="#ffffff"/>
      <rect width="2" height="2" fill="#e04848"/>
      <rect x="2" y="2" width="2" height="2" fill="#e04848"/>
    </pattern>
    <path id="pot" d="M10,19 C4,21 3,31 6,35 C8,38 11,39 15,39 L27,39 C31,39 34,38 36,35 C39,31 38,21 32,19 Z"/>
    <clipPath id="potClip"><use href="#pot"/></clipPath>
    <g id="flower">
      <circle cx="0" cy="-1.4" r="1.2"/><circle cx="1.4" cy="0" r="1.2"/><circle cx="0" cy="1.4" r="1.2"/><circle cx="-1.4" cy="0" r="1.2"/>
    </g>
  </defs>
  <!-- patterned wallpaper -->
  <rect width="50" height="54" fill="#ffd8a8"/>
  <rect width="50" height="43" fill="url(#wallpaper)"/>

  <!-- window behind the table: a sunset over green hills -->
  <rect x="7.5" y="2.5" width="31" height="21" fill="#ff9ec4" stroke="#26203a" stroke-width="1"/>
  <circle cx="30" cy="9" r="3.6" fill="#ffc93c"/>
  <path d="M8,16 C14,11 20,12 26,15 C31,12 35,11 38,13 L38,23 L8,23 Z" fill="#4caf50"/>
  <path d="M8,20 C16,16.5 26,17.5 38,19.5" stroke="#26203a" stroke-width="1" fill="none"/>
  <g fill="#ffffff">
    <rect x="8" y="3" width="30" height="2"/><rect x="8" y="21" width="30" height="2"/>
    <rect x="8" y="3" width="2" height="20"/><rect x="36" y="3" width="2" height="20"/>
    <rect x="22" y="3" width="2" height="20"/><rect x="8" y="11" width="30" height="2"/>
  </g>
  <rect x="5.5" y="23.5" width="35" height="2" fill="#ffffff" stroke="#26203a" stroke-width="1"/>

  <g transform="translate(0 8)">
  <!-- checked tablecloth -->
  <rect y="35" width="50" height="11" fill="url(#gingham)"/>
  <rect y="34.4" width="50" height="1.4" fill="#26203a"/>

  <!-- steam curling up from spout and cup -->
  <path d="M46,9 C44,7 47,5 45,2" stroke="#ffffff" stroke-width="1.4" fill="none"/>
  <path d="M39,22 C37,20 40,18 38,15 M43,23 C41,21 44,19 42,16" stroke="#ffffff" stroke-width="1.3" fill="none"/>

  <!-- handle and spout behind the body -->
  <path d="M33,22 C41,21 42,33 34,34" stroke="#26203a" stroke-width="4.4" fill="none"/>
  <path d="M33,22 C41,21 42,33 34,34" stroke="#3a6fd8" stroke-width="2" fill="none"/>
  <path d="M8,26 C3,25 2,19 -1,16 L1,14 C5,17 7,21 11,22 Z" fill="#3a6fd8" stroke="#26203a" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- body with a pink-and-white flower pattern -->
  <use href="#pot" fill="#3a6fd8" stroke="#26203a" stroke-width="1.5"/>
  <g clip-path="url(#potClip)">
    <rect x="0" y="22" width="44" height="2" fill="#ffc93c"/>
    <rect x="0" y="35" width="44" height="2" fill="#ffc93c"/>
    <ellipse cx="21" cy="29.5" rx="6.5" ry="4.2" fill="#ffffff"/>
    <use href="#flower" fill="#ff9ec4" transform="translate(21 29.5)"/>
    <rect x="20" y="28.5" width="2" height="2" fill="#ffc93c"/>
    <g fill="#ffffff"><use href="#flower" transform="translate(10 30)"/><use href="#flower" transform="translate(32 30)"/></g>
  </g>
  <use href="#pot" fill="none" stroke="#26203a" stroke-width="1.5"/>

  <!-- lid and knob -->
  <path d="M10.5,19.5 C11,14 31,14 31.5,19.5 Z" fill="#3a6fd8" stroke="#26203a" stroke-width="1.4"/>
  <rect x="11" y="15" width="20" height="1" fill="#ffffff"/>
  <circle cx="21" cy="12.5" r="2.4" fill="#ffc93c" stroke="#26203a" stroke-width="1.2"/>

  <!-- cup of tea on a saucer -->
  <ellipse cx="42" cy="38" rx="7" ry="2" fill="#ffffff" stroke="#26203a" stroke-width="1.2"/>
  <path d="M36.5,26.5 L47.5,26.5 C47.5,32 46,36.5 42,36.5 C38,36.5 36.5,32 36.5,26.5 Z" fill="#ffffff" stroke="#26203a" stroke-width="1.3"/>
  <rect x="37" y="26.5" width="10" height="2" fill="#8a4b2a"/>
  <rect x="37" y="30" width="10" height="1.4" fill="#ff9ec4"/>
  <path d="M47,28.5 C50.5,28.5 50.5,33 46.5,33" stroke="#26203a" stroke-width="1.3" fill="none"/>

  <!-- a sugar cube or two -->
  <g fill="#ffffff" stroke="#26203a" stroke-width="1"><rect x="2.5" y="38.5" width="3" height="3"/><rect x="6.5" y="39.5" width="3" height="3"/></g>
  </g>
</svg>
