  <use href="#leaf" transform="translate(44 6) rotate(15)"/>
  <use href="#leaf" transform="translate(45 14) rotate(80) scale(0.8)"/>
  <use href="#leaf" transform="translate(6 45) rotate(200)"/>
  <use href="#leaf" transform="translate(14 47) rotate(-30) scale(0.85)"/>
  <use href="#leaf" transform="translate(46 40) rotate(40) scale(0.85)"/>

  <!-- the branch it sleeps on -->
