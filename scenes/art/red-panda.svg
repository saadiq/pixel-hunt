  <path d="M-2,8 C8,10 12,6 18,4" stroke="#8b5a2b" stroke-width="1.6" fill="none"/>
  <path d="M52,46 C44,44 40,47 34,51" stroke="#2a1d1a" stroke-width="3.6" fill="none"/>
  <path d="M52,46 C44,44 40,47 34,51" stroke="#8b5a2b" stroke-width="1.6" fill="none"/>
  <use href="#leaf" transform="translate(5 5) rotate(-20)"/>
