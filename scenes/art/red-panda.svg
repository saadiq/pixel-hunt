<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 52" width="50" height="52">
  <metadata>{"id":"red-panda","name":"Red Panda","blurb":"A lazy afternoon nap, high up in the maple.","band":"hard","W":50,"H":52,"slots":3,"lanes":5,"chunk":[22,32],"wait":0.9,"waitSlack":1,"bg":"#bfe6f2"}</metadata>
  <defs>
