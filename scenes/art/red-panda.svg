  <g clip-path="url(#tailClip)" fill="#f5c27a">
    <rect x="30" y="35" width="16" height="2"/><rect x="30" y="40" width="16" height="2"/><rect x="30" y="45" width="16" height="2"/>
  </g>

  <!-- body draped along the branch, with dark legs dangling -->
