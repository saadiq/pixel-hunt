<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 54" width="44" height="54">
  <metadata>{"id":"gumball-machine","name":"Gumball Machine","blurb":"One coin, one twist, and fingers crossed for blue.","band":"hard","W":44,"H":54,"slots":3,"lanes":5,"chunk":[18,26],"wait":0.8,"waitSlack":1,"bg":"#ffc2d4"}</metadata>
  <defs>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="1" height="1" fill="#ffffff"/>
      <rect x="4" y="4" width="1" height="1" fill="#ffffff"/>
    </pattern>
    <pattern id="checks" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect width="3" height="3" fill="#ffffff"/>
      <rect x="3" y="3" width="3" height="3" fill="#ffffff"/>
    </pattern>
    <clipPath id="glass"><circle cx="22" cy="19" r="12.9"/></clipPath>
  </defs>
  <!-- polka-dot wallpaper and a checked shop floor -->
