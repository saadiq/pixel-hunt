    <circle cx="20" cy="21" r="1.95" fill="#4cc26b"/>
    <circle cx="24" cy="21" r="1.95" fill="#ffcf3a"/>
    <circle cx="28" cy="21" r="1.95" fill="#4cc26b"/>
