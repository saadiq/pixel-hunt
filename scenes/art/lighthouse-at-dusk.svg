<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 42 48" width="42" height="48">
  <metadata>{"id":"lighthouse-at-dusk","name":"Lighthouse at Dusk","blurb":"The lamp comes on as the sun goes down.","band":"medium","W":42,"H":48,"slots":3,"lanes":5,"chunk":[34,50],"wait":1,"waitSlack":1,"bg":"#5b4b9e"}</metadata>
