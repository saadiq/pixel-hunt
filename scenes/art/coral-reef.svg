      <use href="#front" stroke="#c75bd1" stroke-width="3.9"/>
      <g fill="#f29be6">
        <circle cx="3" cy="41.6" r="1.7"/>
        <circle cx="9" cy="36.6" r="1.7"/>
        <circle cx="15" cy="40.6" r="1.7"/>
        <circle cx="21" cy="35.6" r="1.7"/>
        <circle cx="27" cy="39.6" r="1.7"/>
        <circle cx="33" cy="35.6" r="1.7"/>
        <circle cx="39" cy="40.6" r="1.7"/>
