        <circle cx="5" cy="8" r="1.8"/>
        <circle cx="3" cy="15" r="1.2"/>
      </g>
      <g fill="#ffffff"><rect x="47" y="5" width="1" height="1"/><rect x="4" y="7" width="1" height="1"/></g>
      <!-- anemone, back tentacles in shade -->
      <use href="#back" stroke="#1d1a2e" stroke-width="6.4"/>
      <use href="#back" stroke="#8e3a9e" stroke-width="3.9"/>
      <rect x="-2" y="48" width="58" height="8" fill="#8e3a9e"/>
      <!-- clownfish -->
      <g transform="translate(0 4)">
        <path d="M43,22 L52,13 C54,18 54,27 52,32 Z" fill="#ff7a1f" stroke="#1d1a2e" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M51,14.5 C52.6,19 52.6,26 51,30.5" fill="none" stroke="#1d1a2e" stroke-width="1.5"/>
        <path d="M18,10.5 C22,4 32,3 38,8 C39,10 38,11 37,12 Z" fill="#ff7a1f" stroke="#1d1a2e" stroke-width="1.6" stroke-linejoin="round"/>
        <g clip-path="url(#bodyClip)">
          <rect width="54" height="54" fill="#ff7a1f"/>
          <rect y="28" width="54" height="10" fill="#d9531e"/>
          <path d="M17.5,8 C14,15 14,29 17.5,36 L22.5,36 C19.5,29 19.5,15 22.5,8 Z" fill="#ffffff" stroke="#1d1a2e" stroke-width="1.4"/>
          <path d="M27,8 C25,15 25,29 27,36 L32,36 C30,29 30,15 32,8 Z" fill="#ffffff" stroke="#1d1a2e" stroke-width="1.4"/>
          <path d="M38.5,8 L43,8 L43,36 L38.5,36 Z" fill="#ffffff" stroke="#1d1a2e" stroke-width="1.4"/>
