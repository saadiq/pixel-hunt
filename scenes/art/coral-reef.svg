<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <metadata>{"id":"coral-reef","name":"Coral Reef","blurb":"A clownfish peeking out of its anemone, safe in its tank.","band":"medium","W":48,"H":48,"slots":3,"lanes":4,"chunk":[60,95],"wait":0.8,"waitSlack":1,"bg":"#9fe0f7"}</metadata>
  <defs>
