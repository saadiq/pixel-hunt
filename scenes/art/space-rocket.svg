<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 46 58" width="46" height="58">
  <metadata>{"id":"space-rocket","name":"Space Rocket","blurb":"Three, two, one... see you at the ringed planet!","band":"hard","W":46,"H":58,"slots":3,"lanes":5,"chunk":[23,33],"wait":0.8,"waitSlack":1,"bg":"#26306b"}</metadata>
