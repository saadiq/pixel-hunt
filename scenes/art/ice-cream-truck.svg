<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 44 46" width="44" height="46">
  <metadata>{"id":"ice-cream-truck","name":"Ice Cream Truck","blurb":"You can hear the jingle from three streets away.","band":"medium","W":44,"H":46,"slots":4,"lanes":4,"chunk":[26,37],"wait":0.8,"waitSlack":1,"bg":"#e3d7ff"}</metadata>
  <defs>
