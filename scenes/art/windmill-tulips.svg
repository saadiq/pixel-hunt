<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 60" width="54" height="60">
  <metadata>{"id":"windmill-tulips","name":"Windmill and Tulips","blurb":"Spring in Holland, painted on a Delft tile.","band":"hard","W":54,"H":60,"slots":3,"lanes":5,"chunk":[26,38],"wait":0.8,"waitSlack":1,"bg":"#a8e0ff"}</metadata>
