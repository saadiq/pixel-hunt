<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 52" width="48" height="52">
  <metadata>{"id":"venice-canal","name":"Venice Canal","blurb":"A gondola slips past the painted houses.","band":"medium","W":48,"H":52,"slots":3,"lanes":5,"chunk":[35,52],"wait":0.8,"waitSlack":1,"bg":"#9fd8f0"}</metadata>
  <defs>
    <pattern id="waves" x="0" y="38" width="10" height="5" patternUnits="userSpaceOnUse">
      <rect x="1" y="2" width="3" height="1" fill="#8fe0dc"/>
      <rect x="6" y="4" width="3" height="1" fill="#8fe0dc"/>
    </pattern>
    <!-- an arched window with shutters, 4 wide and 4 tall -->
    <g id="win">
      <rect x="0" y="0" width="1" height="4" fill="#3fa36b"/>
      <rect x="3" y="0" width="1" height="4" fill="#3fa36b"/>
      <rect x="1" y="0" width="2" height="4" fill="#2a1f33"/>
    </g>
    <path id="hull" d="M2.5,41 C6,45 38,46 45.5,40.5 L46.5,39.5 C46,46.5 39,48.5 24,48.5 C10,48.5 4,46.5 2.5,41 Z"/>
  </defs>
  <!-- sky with a cloud -->
  <rect width="48" height="52" fill="#9fd8f0"/>
  <g fill="#ffffff"><rect x="34" y="2" width="9" height="2" rx="1"/><rect x="36" y="0.5" width="4" height="3" rx="1.5"/></g>

  <!-- three painted houses -->
  <g fill="#2a1f33">
    <rect x="-1" y="8" width="17" height="32"/>
    <rect x="15" y="4" width="18" height="36"/>
    <rect x="32" y="7" width="17" height="33"/>
  </g>
  <rect x="0" y="9" width="15" height="31" fill="#e0703a"/>
  <rect x="16" y="5" width="16" height="35" fill="#f7a8b8"/>
  <rect x="33" y="8" width="15" height="32" fill="#f5c04a"/>
  <!-- cornices -->
  <g fill="#ffffff">
    <rect x="0" y="10" width="15" height="1"/><rect x="16" y="6" width="16" height="1"/><rect x="33" y="9" width="15" height="1"/>
  </g>
  <!-- windows -->
  <use href="#win" x="2" y="13"/><use href="#win" x="9" y="13"/>
  <use href="#win" x="2" y="27"/><use href="#win" x="9" y="27"/>
  <use href="#win" x="2" y="20"/><use href="#win" x="9" y="20"/>
  <use href="#win" x="35" y="12"/><use href="#win" x="42" y="12"/>
  <use href="#win" x="35" y="19"/><use href="#win" x="42" y="19"/>
  <use href="#win" x="35" y="26"/><use href="#win" x="42" y="26"/>
  <!-- flower boxes -->
  <g fill="#f7a8b8">
    <rect x="2" y="17" width="4" height="1"/><rect x="9" y="17" width="4" height="1"/>
    <rect x="35" y="16" width="4" height="1"/><rect x="42" y="23" width="4" height="1"/>
    <rect x="2" y="31" width="4" height="1"/><rect x="35" y="30" width="4" height="1"/>
  </g>
  <g fill="#3fa36b">
    <rect x="2" y="18" width="4" height="1"/><rect x="9" y="18" width="4" height="1"/>
    <rect x="35" y="17" width="4" height="1"/><rect x="42" y="24" width="4" height="1"/>
    <rect x="2" y="32" width="4" height="1"/><rect x="35" y="31" width="4" height="1"/>
  </g>
  <!-- the pink house: a triple gothic window and a white balcony -->
  <g fill="#2a1f33">
    <rect x="18" y="9" width="2" height="5"/><rect x="23" y="9" width="2" height="5"/><rect x="28" y="9" width="2" height="5"/>
    <rect x="18" y="18" width="2" height="5"/><rect x="23" y="18" width="2" height="5"/><rect x="28" y="18" width="2" height="5"/>
  </g>
  <rect x="17" y="23" width="14" height="1.6" fill="#ffffff"/>
  <g fill="#3fa36b"><rect x="18" y="22" width="2" height="1"/><rect x="23" y="22" width="2" height="1"/><rect x="28" y="22" width="2" height="1"/></g>
  <!-- water doors -->
  <g fill="#3fa36b" stroke="#2a1f33" stroke-width="1">
    <path d="M21.5,38 L21.5,31 C21.5,28.5 26.5,28.5 26.5,31 L26.5,38 Z"/>
  </g>
  <g fill="#2a1f33">
    <rect x="35" y="33" width="2" height="5"/><rect x="42" y="33" width="2" height="5"/>
  </g>

  <!-- canal -->
  <rect y="38" width="48" height="14" fill="#2f8fa8"/>
  <rect y="38" width="48" height="14" fill="url(#waves)"/>
  <rect y="37.4" width="48" height="1.2" fill="#2a1f33"/>

  <!-- striped mooring poles -->
  <g stroke="#2a1f33" stroke-width="1">
    <rect x="11.5" y="31.5" width="3" height="15" fill="#ffffff"/>
    <rect x="29.5" y="32.5" width="3" height="14" fill="#ffffff"/>
  </g>
  <g fill="#e0703a">
    <rect x="12" y="34" width="2" height="2"/><rect x="12" y="38" width="2" height="2"/><rect x="12" y="42" width="2" height="2"/>
    <rect x="30" y="35" width="2" height="2"/><rect x="30" y="39" width="2" height="2"/><rect x="30" y="43" width="2" height="2"/>
  </g>

  <!-- gondola -->
  <path d="M8,37 L5,47" stroke="#2a1f33" stroke-width="1.4" stroke-linecap="round"/>
  <path d="M2,44 C10,46.5 34,46.5 44,43 L45.5,41 C46,46 39,48.8 24,48.8 C11,48.8 4,47.5 2,44 Z" fill="#2a1f33" stroke="#2a1f33" stroke-width="0.8" stroke-linejoin="round"/>
  <rect x="20" y="43" width="8" height="2" fill="#e0703a" stroke="#2a1f33" stroke-width="0.6"/>
  <g fill="#ffffff"><rect x="45" y="36.5" width="1" height="4"/><rect x="46" y="37" width="2" height="1"/><rect x="46" y="39" width="2" height="1"/></g>
</svg>
