<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 54 54" width="54" height="54">
  <metadata>{"id":"bento-box","name":"Bento Box","blurb":"Lunch with a smiling rice ball.","band":"hard","W":54,"H":54,"slots":3,"lanes":5,"chunk":[70,100],"wait":0.95,"bg":"#3d8fe0"}</metadata>
  <defs>
    <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse">
      <rect x="1" y="1" width="2" height="2" fill="#ffffff"/>
      <rect x="4" y="4" width="1" height="1" fill="#ffffff"/>
    </pattern>
    <g id="nigiri">
      <rect x="0.5" y="4.5" width="8" height="5" rx="1.5" fill="#ffffff" stroke="#2a2233" stroke-width="1"/>
      <rect x="1" y="8" width="7" height="1" fill="#cfd8e6"/>
      <path d="M0.5,5.5 C0.5,1 8.5,1 8.5,5.5 Z" fill="#ff9a76" stroke="#2a2233" stroke-width="1" stroke-linejoin="round"/>
      <rect x="2.5" y="3" width="1" height="2" fill="#ffffff"/>
      <rect x="5.5" y="3" width="1" height="2" fill="#ffffff"/>
    </g>
    <g id="egg">
      <rect x="0.5" y="0.5" width="5" height="9" fill="#ffd23f" stroke="#2a2233" stroke-width="1"/>
      <rect x="1" y="7" width="4" height="2" fill="#f39a2b"/>
      <rect x="2" y="3" width="3" height="1" fill="#f39a2b"/>
      <rect x="1" y="5" width="2" height="1" fill="#f39a2b"/>
    </g>
    <g id="octo">
      <path d="M0.5,6 C0.5,0.5 10.5,0.5 10.5,6 L10.5,10.5 L8.5,9 L7,10.5 L5.5,9 L4,10.5 L2.5,9 L0.5,10.5 Z" fill="#e8453c" stroke="#2a2233" stroke-width="1" stroke-linejoin="round"/>
      <rect x="1" y="6" width="9" height="2" fill="#f39a2b"/>
      <rect x="3" y="3" width="1" height="2" fill="#2a2233"/>
      <rect x="7" y="3" width="1" height="2" fill="#2a2233"/>
      <rect x="2" y="2" width="1" height="1" fill="#ffffff"/>
    </g>
    <g id="broc">
      <rect x="4.5" y="5.5" width="3" height="5" fill="#cfd8e6" stroke="#2a2233" stroke-width="1"/>
      <circle cx="3" cy="5" r="2.6" fill="#5cc23a" stroke="#2a2233" stroke-width="1"/>
      <circle cx="9" cy="5" r="2.6" fill="#5cc23a" stroke="#2a2233" stroke-width="1"/>
      <circle cx="6" cy="3" r="2.8" fill="#5cc23a" stroke="#2a2233" stroke-width="1"/>
      <rect x="5" y="2" width="1" height="1" fill="#ffd23f"/>
      <rect x="2" y="5" width="1" height="1" fill="#ffd23f"/>
      <rect x="9" y="4" width="1" height="1" fill="#ffd23f"/>
    </g>
    <g id="tom">
      <circle cx="3" cy="3.5" r="2.9" fill="#e8453c" stroke="#2a2233" stroke-width="1"/>
      <rect x="2" y="0" width="2" height="1" fill="#5cc23a"/>
      <rect x="1.5" y="2" width="1" height="1" fill="#ffffff"/>
    </g>
  </defs>
  <!-- placemat with dot pattern -->
  <rect width="54" height="54" fill="#3d8fe0"/>
  <rect width="54" height="54" fill="url(#dots)"/>
  <!-- box: outline, red rim, inner outline -->
  <rect x="2.5" y="3.5" width="49" height="48" rx="3" fill="#e8453c" stroke="#2a2233" stroke-width="1"/>
  <rect x="5" y="49" width="44" height="2" fill="#f39a2b"/>
  <rect x="5.5" y="6.5" width="43" height="42" fill="#cfd8e6" stroke="#2a2233" stroke-width="1"/>
  <!-- A: onigiri on lettuce -->
  <rect x="6" y="11" width="20" height="18" fill="#5cc23a"/>
  <path d="M6,13 L8,11 L10,13 L12,11 L14,13 L16,11 L18,13 L20,11 L22,13 L24,11 L26,13 L26,7 L6,7 Z" fill="#cfd8e6"/>
  <path d="M16,9.5 C18,9.5 25,21 25,25 C25,28 22,28.5 16,28.5 C10,28.5 7,28 7,25 C7,21 14,9.5 16,9.5 Z" fill="#ffffff" stroke="#2a2233" stroke-width="1"/>
  <rect x="8" y="25" width="16" height="3" fill="#cfd8e6"/>
  <rect x="12" y="22" width="8" height="7" fill="#2a2233"/>
  <rect x="13" y="16" width="1" height="2" fill="#2a2233"/>
  <rect x="18" y="16" width="1" height="2" fill="#2a2233"/>
  <rect x="11" y="18" width="2" height="1" fill="#ff9a76"/>
  <rect x="19" y="18" width="2" height="1" fill="#ff9a76"/>
  <rect x="15" y="19" width="2" height="1" fill="#2a2233"/>
  <rect x="13" y="12" width="1" height="2" fill="#ffffff"/>
  <!-- B: two nigiri on green grass -->
  <rect x="28" y="7" width="20" height="12" fill="#5cc23a"/>
  <use href="#nigiri" x="28.5" y="8"/>
  <use href="#nigiri" x="38.5" y="8"/>
  <!-- C: tamagoyaki -->
  <rect x="28" y="21" width="20" height="11" fill="#ffffff"/>
  <use href="#egg" x="29" y="21.5"/>
  <use href="#egg" x="35" y="21.5"/>
  <use href="#egg" x="41" y="21.5"/>
  <!-- D: broccoli + tomatoes -->
  <rect x="6" y="32" width="15" height="16" fill="#ffffff"/>
  <use href="#broc" x="7" y="32"/>
  <use href="#tom" x="7" y="41"/>
  <use href="#tom" x="13" y="41"/>
  <!-- E: sausage octopuses on lettuce -->
  <rect x="23" y="34" width="25" height="14" fill="#5cc23a"/>
  <path d="M23,36 L25,34 L27,36 L29,34 L31,36 L33,34 L35,36 L37,34 L39,36 L41,34 L43,36 L45,34 L47,36 L48,35 L48,34 L23,34 Z" fill="#ffd23f"/>
  <use href="#octo" x="24" y="37"/>
  <use href="#octo" x="36" y="37"/>
  <!-- divider walls -->
  <g fill="#e8453c">
    <rect x="26" y="7" width="2" height="25"/>
    <rect x="6" y="30" width="20" height="2"/>
    <rect x="28" y="19" width="20" height="2"/>
    <rect x="21" y="32" width="2" height="16"/>
    <rect x="23" y="32" width="25" height="2"/>
  </g>
</svg>
