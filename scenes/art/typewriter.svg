<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 46" width="48" height="46">
  <metadata>{"id":"typewriter","name":"Typewriter","blurb":"Clack, clack, clack... ding!","band":"hard","W":48,"H":46,"slots":3,"lanes":5,"chunk":[19,28],"wait":0.8,"waitSlack":1,"bg":"#ffb3a7"}</metadata>
  <defs>
    <pattern id="stripes" width="6" height="8" patternUnits="userSpaceOnUse">
      <rect width="3" height="8" fill="#ffd9cf"/>
      <rect x="1" y="2" width="1" height="1" fill="#e8433a"/>
      <rect x="4" y="6" width="1" height="1" fill="#e8433a"/>
    </pattern>
    <path id="body" d="M11,17 L37,17 C39,17 40,18 40.5,20 L43,37 C43.3,39 42,40.5 40,40.5 L8,40.5 C6,40.5 4.7,39 5,37 L7.5,20 C8,18 9,17 11,17 Z"/>
    <clipPath id="bodyClip">
