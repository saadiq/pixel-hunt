<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 54" width="52" height="54">
  <metadata>{"id":"paper-lanterns","name":"Lantern Festival","blurb":"Paper lanterns strung across the rooftops, glowing all night.","band":"hard","W":52,"H":54,"slots":3,"lanes":5,"chunk":[23,33],"wait":0.8,"waitSlack":1,"bg":"#2b3a8f"}</metadata>
