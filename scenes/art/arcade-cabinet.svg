<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 46 56" width="46" height="56">
  <metadata>{"id":"arcade-cabinet","name":"Arcade Cabinet","blurb":"One more coin. Just one more.","band":"medium","W":46,"H":56,"slots":3,"lanes":4,"chunk":[66,98],"wait":0.6,"bg":"#4b2f8f"}</metadata>
  <defs>
    <!-- neon plus-sign wallpaper -->
    <pattern id="wall" x="1" y="1" width="9" height="9" patternUnits="userSpaceOnUse">
      <rect x="2" y="1" width="1" height="3" fill="#5ce1e6"/>
      <rect x="1" y="2" width="3" height="1" fill="#5ce1e6"/>
      <rect x="6" y="6" width="1" height="1" fill="#5ce1e6"/>
    </pattern>
    <pattern id="floor" x="0" y="46" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#ffffff"/>
      <rect width="4" height="4" fill="#4b2f8f"/>
      <rect x="4" y="4" width="4" height="4" fill="#4b2f8f"/>
    </pattern>
    <g id="cabShape">
      <rect x="8" y="2" width="30" height="10.5"/>
      <rect x="9" y="12" width="28" height="19.5"/>
      <path d="M7,31 L39,31 L41,36.5 L5,36.5 Z"/>
      <rect x="10" y="36" width="26" height="16"/>
    </g>
    <clipPath id="cabClip">
      <rect x="8" y="2" width="30" height="10.5"/>
      <rect x="9" y="12" width="28" height="19.5"/>
      <path d="M7,31 L39,31 L41,36.5 L5,36.5 Z"/>
      <rect x="10" y="36" width="26" height="16"/>
    </clipPath>
  </defs>
  <!-- wall and checker floor -->
  <rect width="46" height="56" fill="#4b2f8f"/>
  <rect width="46" height="46" fill="url(#wall)"/>
  <rect y="46" width="46" height="10" fill="url(#floor)"/>
  <rect y="45.5" width="46" height="1.2" fill="#1a1530"/>
  
  <!-- cabinet body: red, shaded down the right side, one dark outline -->
  <use href="#cabShape" fill="#1a1530" stroke="#1a1530" stroke-width="2.2"/>
  <use href="#cabShape" fill="#e8433a"/>
  <g clip-path="url(#cabClip)" fill="#a82a3a">
    <rect x="33.5" y="0" width="10" height="31"/>
    <rect x="32.5" y="36.5" width="10" height="20"/>
    <rect x="0" y="34.5" width="46" height="2"/>
  </g>
  <rect x="8" y="12" width="30" height="1" fill="#1a1530"/>
  <rect x="5" y="36.3" width="36" height="1" fill="#1a1530"/>

  <!-- marquee sign with bulbs -->
  <rect x="10.5" y="4" width="25" height="6" fill="#ffd23f" stroke="#1a1530" stroke-width="1.2"/>
  <g fill="#e8433a">
    <circle cx="15" cy="7" r="1.6"/><circle cx="23" cy="7" r="1.6"/><circle cx="31" cy="7" r="1.6"/>
  </g>

  <!-- screen with a space invader -->
  <rect x="11.5" y="14" width="23" height="15.5" rx="1" fill="#1a1530"/>

  <g fill="#ffffff"><rect x="14" y="19" width="1" height="1"/><rect x="31" y="21" width="1" height="1"/><rect x="29" y="17" width="1" height="1"/><rect x="15" y="26" width="1" height="1"/></g>
  <g fill="#6ee05a"><rect x="19" y="18" width="1" height="1"/><rect x="25" y="18" width="1" height="1"/><rect x="20" y="19" width="1" height="1"/><rect x="24" y="19" width="1" height="1"/><rect x="19" y="20" width="7" height="1"/><rect x="18" y="21" width="2" height="1"/><rect x="21" y="21" width="3" height="1"/><rect x="25" y="21" width="2" height="1"/><rect x="17" y="22" width="11" height="1"/><rect x="17" y="23" width="1" height="1"/><rect x="19" y="23" width="7" height="1"/><rect x="27" y="23" width="1" height="1"/><rect x="17" y="24" width="1" height="1"/><rect x="19" y="24" width="1" height="1"/><rect x="25" y="24" width="1" height="1"/><rect x="27" y="24" width="1" height="1"/><rect x="20" y="25" width="2" height="1"/><rect x="23" y="25" width="2" height="1"/></g>
  <g fill="#5ce1e6"><rect x="22" y="27" width="1" height="1"/><rect x="21" y="28" width="3" height="1"/></g>

  <!-- control panel: joystick and buttons -->
  <rect x="13" y="31" width="1.6" height="3" fill="#1a1530"/>
  <circle cx="13.8" cy="31" r="1.8" fill="#ffd23f" stroke="#1a1530" stroke-width="1"/>
  <g stroke="#1a1530" stroke-width="0.9">
    <circle cx="23.5" cy="33.5" r="1.5" fill="#5ce1e6"/>
    <circle cx="28.5" cy="33.5" r="1.5" fill="#ffd23f"/>
    <circle cx="33.5" cy="33.5" r="1.5" fill="#ffffff"/>
  </g>

  <!-- coin door -->
  <rect x="17.5" y="39.5" width="11" height="7.5" fill="#a82a3a" stroke="#1a1530" stroke-width="1.2"/>
  <g fill="#ffd23f"><rect x="19.5" y="41.5" width="2" height="3.5"/><rect x="24.5" y="41.5" width="2" height="3.5"/></g>
  <rect x="10" y="50" width="26" height="2.5" fill="#1a1530"/>
</svg>
