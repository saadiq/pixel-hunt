<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 52 44" width="52" height="44">
  <metadata>{"id":"monarch-butterfly","name":"Monarch Butterfly","blurb":"A quick rest on the flowers before the long flight south.","band":"hard","W":52,"H":44,"slots":2,"lanes":5,"chunk":[16,24],"wait":1,"waitSlack":1,"bg":"#bde6f5"}</metadata>
